<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React 데일리</title>
    <!-- 첫 페인트 전에 저장된 테마를 적용해, 다크모드 사용자에게 흰 화면이 번쩍이는 것을 막는다.
         React 가 뜨기 전에 실행되어야 하므로 여기에 둔다. 규칙은 src/lib/theme.ts 와 같다.
         (저장값이 light / dark 면 그대로, 없거나 system 이거나 알 수 없는 값이면 OS 설정을 따른다.)
         둘이 어긋나지 않는지는 src/lib/theme.test.ts 가 확인한다. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          var dark =
            theme === "dark" ||
            (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (dark) root.classList.add("dark");
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
