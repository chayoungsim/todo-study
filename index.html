<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React 데일리</title>
    <!-- 첫 페인트 전에 저장된 테마를 적용해, 다크모드 사용자에게 흰 화면이 번쩍이는 것을 막는다.
         next-themes 의 ThemeProvider 가 렌더링하는 script 는 클라이언트에서 실행되지 않기 때문이다.
         저장 키(theme)와 규칙(저장값 우선, 없거나 system 이면 OS 설정)은 next-themes 와 같게 맞춘다. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          var dark =
            theme === "dark" ||
            ((theme === null || theme === "system") &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
